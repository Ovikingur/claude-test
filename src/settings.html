<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assistant Settings</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body {
        margin: 0;
        padding: 20px;
        background: linear-gradient(135deg, #0f172a, #111827);
        color: #f8fafc;
      }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { margin: 0 0 16px; color: #cbd5e1; font-size: 13px; }
      .cards { display: grid; gap: 12px; }
      .card {
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 14px;
        padding: 12px;
        background: rgba(255,255,255,0.06);
        cursor: pointer;
        transition: transform 180ms ease, border-color 180ms ease;
      }
      .card:hover { transform: translateY(-1px); border-color: rgba(255,255,255,0.24); }
      .card.active { border-color: #38bdf8; box-shadow: 0 0 0 1px rgba(56,189,248,0.3); }
      .card-content { display: flex; align-items: center; gap: 12px; }
      .card img { width: 48px; height: 48px; object-fit: contain; }
      .title { font-weight: 600; font-size: 14px; }
      .desc { font-size: 12px; color: #cbd5e1; margin-top: 3px; }
      .actions { margin-top: 16px; display: flex; gap: 10px; }
      select {
        border: 1px solid rgba(255,255,255,0.16);
        border-radius: 999px;
        padding: 8px 10px;
        font-size: 12px;
        background: rgba(15,23,42,0.8);
        color: #f8fafc;
      }
      button {
        border: none; border-radius: 999px; padding: 8px 12px; font-size: 12px; cursor: pointer;
        background: #38bdf8; color: white;
      }
    </style>
  </head>
  <body>
    <h1>Assistant Character</h1>
    <p>Choose your worm avatar. Your selection is saved automatically and reused on the next launch.</p>
    <div class="cards" id="cards"></div>
    <div class="actions">
      <select id="state-select">
        <option value="idle">Idle</option>
        <option value="thinking">Thinking</option>
        <option value="speaking">Speaking</option>
        <option value="error">Error</option>
        <option value="happy">Happy</option>
      </select>
      <button id="save-button">Save Selection</button>
    </div>

    <script>
      const cards = document.getElementById('cards');
      const saveButton = document.getElementById('save-button');
      const stateSelect = document.getElementById('state-select');
      let selectedId = null;
      let settings = null;

      function renderCharacters(characters) {
        cards.innerHTML = '';
        characters.forEach((character) => {
          const card = document.createElement('div');
          card.className = `card${character.id === selectedId ? ' active' : ''}`;
          card.innerHTML = `
            <div class="card-content">
              <img src="${character.image}" alt="${character.name}" />
              <div>
                <div class="title">${character.title}</div>
                <div class="desc">${character.description}</div>
              </div>
            </div>
          `;
          card.addEventListener('click', () => {
            selectedId = character.id;
            renderCharacters(characters);
          });
          cards.appendChild(card);
        });
      }

      window.electronAPI.getSettings().then((payload) => {
        settings = payload;
        selectedId = payload.characterId || payload.defaultCharacterId;
        stateSelect.value = payload.avatarState || 'idle';
        renderCharacters(payload.characters || []);
      });

      saveButton.addEventListener('click', async () => {
        if (!selectedId) return;
        await window.electronAPI.saveSettings({ characterId: selectedId, avatarState: stateSelect.value });
        saveButton.textContent = 'Saved';
        setTimeout(() => { saveButton.textContent = 'Save Selection'; }, 1200);
      });
    </script>
  </body>
</html>
