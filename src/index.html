<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyAI Assistant</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
      }
      .window {
        width: 180px;
        height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at top, rgba(255,255,255,0.18), rgba(255,255,255,0.02));
        border-radius: 999px;
        backdrop-filter: blur(14px);
      }
      .avatar-shell {
        position: relative;
        width: 92px;
        height: 92px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: idle-bob 2.8s ease-in-out infinite;
        transform-origin: center bottom;
      }
      .avatar-shell img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
        image-rendering: auto;
        filter: drop-shadow(0 5px 16px rgba(0,0,0,0.24));
      }
      .status-pill {
        position: absolute;
        bottom: -6px;
        right: -8px;
        width: 12px;
        height: 12px;
        border-radius: 999px;
        border: 2px solid rgba(255,255,255,0.85);
        background: #31d35f;
      }
      @keyframes idle-bob {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      .state-thinking { animation-duration: 1.5s; }
      .state-speaking { animation-duration: 0.7s; }
      .state-error { animation: error-shake 0.3s linear infinite; }
      .state-happy { animation-duration: 0.9s; animation-name: happy-bounce; }
      @keyframes error-shake {
        0%, 100% { transform: translateX(0px) translateY(0px); }
        25% { transform: translateX(-3px) translateY(-1px); }
        50% { transform: translateX(3px) translateY(1px); }
        75% { transform: translateX(-2px) translateY(0px); }
      }
      @keyframes happy-bounce {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-8px) scale(1.03); }
      }
    </style>
  </head>
  <body>
    <div class="window">
      <div class="avatar-shell" id="avatar-shell">
        <img id="avatar-image" alt="Assistant avatar" />
        <div class="status-pill" id="status-pill"></div>
      </div>
    </div>
    <script>
      const shell = document.getElementById('avatar-shell');
      const image = document.getElementById('avatar-image');
      const statusPill = document.getElementById('status-pill');

      function applyState(character, state) {
        const animationSettings = character?.animation?.[state] || character?.animation?.idle;
        shell.className = `avatar-shell state-${state}`;
        if (animationSettings) {
          shell.style.setProperty('--bob-duration', animationSettings.duration);
          shell.style.setProperty('--bob-amplitude', animationSettings.amplitude);
        }
        image.src = character?.image || '';
        image.alt = `${character?.name || 'Assistant'} avatar`;
        statusPill.style.background = state === 'error' ? '#ef4444' : state === 'thinking' ? '#f59e0b' : state === 'speaking' ? '#3b82f6' : state === 'happy' ? '#22c55e' : '#31d35f';
      }

      window.electronAPI.onAvatarUpdate((payload) => {
        applyState(payload.character, payload.avatarState || 'idle');
      });

      window.electronAPI.getSettings().then((settings) => {
        applyState(settings.character, settings.avatarState || 'idle');
      });

      window.setInterval(() => {
        window.electronAPI.setAvatarState('thinking');
      }, 12000);
    </script>
  </body>
</html>
